name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Draft Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FileTransfer ${{ github.ref_name }}"
          releaseBody: |
            ## 下载

            - **一般用户**：下载 `*-setup.exe`（NSIS 安装包）
            - **企业部署 / 标准安装**：下载 `*.msi`（MSI 安装包）

            ## 说明

            - 仅支持 Windows 10/11（系统自带 WebView2），本次未提供 macOS 安装包
            - 安装包未做代码签名，Windows SmartScreen 可能提示「未知发布者」：点「更多信息 → 仍要运行」即可
            - 本次改动详见 [CHANGELOG](https://github.com/shoucunren-tsy/FileTransfer/blob/main/CHANGELOG.md)
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
